# Skyramp Workspace Configuration
workspace:
  repoName: roshinimichael/flagsmith-testb
  repoUrl: https://github.com/roshinimichael/flagsmith-testb
metadata:
  schemaVersion: v1
  mcpVersion: 0.1.0-rc.6
  executorVersion: v1.3.21
  createdAt: "2026-05-18T08:38:17.958Z"
  updatedAt: "2026-05-18T08:38:17.965Z"
services:
  - serviceName: flagsmith-api
    language: python
    framework: pytest
    testDirectory: api/tests
    api:
      schemaPath: http://localhost:8080/api/v1/schema/
      authType: token
      authHeader: Authorization
      baseUrl: http://localhost:8080
    runtimeDetails:
      serverStartCommand: docker compose up -d flagsmith
      runtime: docker
      dockerNetwork: deployment-testbot_default
  - serviceName: flagsmith-frontend
    language: typescript
    framework: playwright
    testDirectory: frontend/e2e
    api:
      authType: none
      baseUrl: http://localhost:8080
    runtimeDetails:
      serverStartCommand: ENV=local npm run dev
      runtime: local
